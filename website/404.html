<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Chango</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try { var t = localStorage.getItem('chango-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <!-- Absolute paths: GitHub Pages serves this page for any missing URL, at any depth. -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="doc-page" style="min-height:100vh;display:grid;place-items:center">
  <div class="wash"></div>
  <div class="wrap" style="text-align:center">
    <img src="/favicon.svg" alt="" width="72" height="72" style="margin:0 auto 24px">
    <h1>Nothing here.</h1>
    <p style="margin:14px auto 28px;max-width:28em;color:var(--muted);font-size:19px">This page doesn't exist, or it moved. Your files are fine, though: they never left your PC.</p>
    <a class="btn btn-teal" href="/">Go to the Chango home page</a>
  </div>
</main>
</body>
</html>
