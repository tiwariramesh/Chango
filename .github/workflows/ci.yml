name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build OrbitDrop.slnx -c Release

      - name: Test
        run: dotnet test tests/OrbitDrop.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      # Failed tests become annotations, which show on the run page (and in the public API) without opening logs.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter results.trx | Select-Object -First 1
          if ($trx) {
            [xml]$x = Get-Content $trx.FullName
            $x.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | ForEach-Object {
              $msg = ("$($_.Output.ErrorInfo.Message)" -replace "`r?`n", ' ').Trim()
              Write-Output "::error title=$($_.testName)::$msg"
            }
          }

      - name: Probe self-test (regression, diagnostic)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process experiments/OrbitProbe/bin/Release/net10.0-windows10.0.19041.0/OrbitProbe.exe -ArgumentList '--selftest', "$env:RUNNER_TEMP/probe" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP/probe/selftest-result.txt" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA/OrbitProbe" -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Tail 40
          exit $p.ExitCode

      - name: Render UI for design review (light + dark)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process src/OrbitDrop.App/bin/Release/net10.0-windows10.0.19041.0/OrbitDrop.exe -ArgumentList '--render-ui', "$env:RUNNER_TEMP/ui-review" -Wait -PassThru
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: ${{ runner.temp }}/ui-review
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/OrbitDrop.Tests/TestResults
          if-no-files-found: ignore
